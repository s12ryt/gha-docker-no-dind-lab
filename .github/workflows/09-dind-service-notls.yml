name: 09 DinD Service (No TLS)

on:
  workflow_dispatch:

jobs:
  dind-service-notls:
    name: DinD as a service container (docker:dind, no TLS, port 2375)
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:dind
        env:
          DOCKER_TLS_CERTDIR: ''
        options: --privileged
        ports:
          - 2375:2375
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show both daemons and wait for DinD
        run: |
          echo "=== Host daemon (preinstalled on runner) ==="
          docker info --format 'Name={{.Name}}  Server={{.ServerVersion}}'
          echo ""
          echo "=== Waiting for DinD daemon on tcp://127.0.0.1:2375 ==="
          READY=0
          for i in $(seq 1 30); do
            if docker -H tcp://127.0.0.1:2375 info --format 'Name={{.Name}}  Server={{.ServerVersion}}' 2>/dev/null; then
              READY=1
              echo "DinD daemon is ready (attempt $i)"
              break
            fi
            echo "  ... attempt $i/30, retry in 2s"
            sleep 2
          done
          if [ "$READY" != "1" ]; then
            echo "DinD daemon did not become ready in time"
            exit 1
          fi

      - name: Build inside DinD
        run: |
          # 127.0.0.1:2375 goes through the host docker-proxy; the service
          # container's bridge IP bypasses it. Probe both and use whichever
          # survives a real build. If both fail, dump diagnostics.
          CANDIDATES="tcp://127.0.0.1:2375"
          DIND_CID=$(docker ps -aq --filter ancestor=docker:dind | head -n 1)
          if [ -n "$DIND_CID" ]; then
            DIND_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$DIND_CID")
            if [ -n "$DIND_IP" ]; then
              CANDIDATES="$CANDIDATES tcp://$DIND_IP:2375"
            fi
          fi
          echo "Candidate endpoints: $CANDIDATES"

          BUILD_OK=0
          for H in $CANDIDATES; do
            echo "--- probing $H ---"
            if docker -H "$H" version --format 'probe ok (server {{.Server.Version}})' >/dev/null 2>&1; then
              echo "--- building via $H ---"
              if docker -H "$H" build -t hello-dind samples/hello-dind; then
                echo "DIND_HOST=$H" >> "$GITHUB_ENV"
                echo "Build succeeded via $H"
                BUILD_OK=1
                break
              fi
              echo "build via $H failed"
            else
              echo "probe via $H failed"
            fi
          done

          if [ "$BUILD_OK" != "1" ]; then
            echo ""
            echo "=== All endpoints failed - dumping diagnostics ==="
            echo "--- docker ps -a ---"
            docker ps -a
            echo "--- dind container logs (last 80 lines) ---"
            DIND_CID=$(docker ps -aq --filter ancestor=docker:dind | head -n 1)
            if [ -n "$DIND_CID" ]; then
              docker logs "$DIND_CID" 2>&1 | tail -n 80
            else
              echo "(no docker:dind container found)"
            fi
            exit 1
          fi

      - name: Run inside DinD and verify isolation
        run: |
          export DOCKER_HOST="$DIND_HOST"
          echo "Using DOCKER_HOST=$DOCKER_HOST"
          OUT=$(docker run --rm hello-dind)
          echo "Output: $OUT"
          echo "$OUT" | grep -q "inside Docker-in-Docker"
          echo ""
          echo "=== Verify the image does NOT exist on the host daemon ==="
          HOST_IMG=$(docker -H unix:///var/run/docker.sock images -q hello-dind)
          if [ -n "$HOST_IMG" ]; then
            echo "ERROR: hello-dind found on host daemon - build did not happen inside DinD!"
            exit 1
          fi
          echo "Confirmed: hello-dind only exists inside the DinD daemon"
