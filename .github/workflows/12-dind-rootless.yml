name: 12 DinD Rootless (no privileged)

on:
  workflow_dispatch:

jobs:
  dind-rootless:
    name: docker:dind-rootless without the privileged flag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load AppArmor profile permitting unprivileged userns
        run: |
          echo "=== Kernel userns / AppArmor state ==="
          echo "max_user_namespaces: $(cat /proc/sys/user/max_user_namespaces)"
          if [ -f /sys/module/apparmor/parameters/apparmor_restrict_unprivileged_userns ]; then
            echo "apparmor_restrict_unprivileged_userns: $(cat /sys/module/apparmor/parameters/apparmor_restrict_unprivileged_userns)"
          else
            echo "apparmor_restrict_unprivileged_userns: (param not exposed)"
          fi
          echo ""
          echo "=== Control: userns inside an unconfined container ==="
          if docker run --rm --security-opt apparmor=unconfined --security-opt seccomp=unconfined alpine:3.20 unshare -Ur echo "userns works in unconfined container"; then
            echo "-> unconfined is sufficient on this kernel"
          else
            echo "-> blocked: even unconfined containers cannot create userns here (Ubuntu 24.04 behavior)"
          fi
          echo ""
          echo "=== Loading named AppArmor profile with explicit userns permission ==="
          # Ubuntu 24.04 (kernel.apparmor_restrict_unprivileged_userns=1) blocks
          # clone(CLONE_NEWUSER) even for unconfined processes unless a loaded
          # AppArmor profile explicitly grants `userns,`. Container binaries
          # cannot get a path-attached profile, but Docker CAN apply a named
          # profile to the whole container via --security-opt apparmor=<name>.
          sudo tee /etc/apparmor.d/dind-rootless-userns >/dev/null <<'PROFILE'
          # Permissive profile + explicit userns permission for dind-rootless.
          # complain mode: log violations but never deny, so the confined
          # container (incl. docker exec'd processes) can read /proc, connect
          # unix sockets, etc. The `userns,` rule stays because complain mode
          # would still be checked for userns creation on Ubuntu 24.04.
          profile dind-rootless-userns flags=(attach_disconnected,mediate_deleted,complain) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/dind-rootless-userns
          echo "profile dind-rootless-userns loaded (complain mode)"

      - name: Start rootless DinD and wait for readiness
        run: |
          # slirp4netns (used by rootlesskit) creates a tap device, which
          # requires /dev/net/tun to exist inside the container.
          if [ ! -e /dev/net/tun ]; then
            echo "creating /dev/net/tun (missing on this runner)"
            sudo mknod /dev/net/tun c 10 200 || true
          fi
          OPTS="--security-opt apparmor=dind-rootless-userns --security-opt seccomp=unconfined --security-opt systempaths=unconfined"
          if [ -e /dev/fuse ]; then
            OPTS="$OPTS --device /dev/fuse"
          fi
          if [ -e /dev/net/tun ]; then
            OPTS="$OPTS --device /dev/net/tun"
          fi
          echo "Starting dind-rootless with: $OPTS"
          docker run -d --name dind-rootless $OPTS docker:dind-rootless

          echo "Waiting for rootless dockerd over TCP+TLS (rootlesskit port mapping) ..."
          # NOTE: the image's rootlesskit runs with --copy-up=/run, so the
          # unix socket lives in rootlesskit's private mount namespace and is
          # NOT reachable from `docker exec` processes (parent namespace).
          # The image instead maps TCP 2376 (TLS) into the parent namespace,
          # and TLS certs are written to /certs (plain overlay layer, shared).
          DIND_TLS_ENV="export DOCKER_HOST=tcp://localhost:2376 DOCKER_TLS_VERIFY=1 DOCKER_CERT_PATH=/certs/client"
          READY=0
          for i in $(seq 1 45); do
            if docker exec dind-rootless sh -c "$DIND_TLS_ENV && docker version >/dev/null 2>&1"; then
              READY=1
              echo "rootless DinD ready (attempt $i)"
              break
            fi
            REMAINDER=$((i % 10))
            if [ "$REMAINDER" = "0" ]; then
              echo "  ... attempt $i/45 still not ready; docker version output:"
              docker exec dind-rootless sh -c "$DIND_TLS_ENV && docker version 2>&1" | head -n 8 || true
              echo "  certs present in /certs/client:"
              docker exec dind-rootless sh -c 'ls -1 /certs/client 2>&1' || true
              echo "  last daemon log lines:"
              docker logs dind-rootless 2>&1 | tail -n 2 || true
            fi
            sleep 2
          done
          if [ "$READY" != "1" ]; then
            echo "rootless DinD did not become ready in time; dumping logs:"
            docker logs dind-rootless || true
            exit 1
          fi
          echo "=== Proof: daemon runs without root / privileged ==="
          docker exec dind-rootless sh -c 'echo "exec runs as: $(id)"'
          docker exec dind-rootless sh -c "$DIND_TLS_ENV && docker info --format 'daemon security options: {{.SecurityOptions}}'" || true

      - name: Build and run inside rootless DinD
        run: |
          docker cp samples/hello-dind dind-rootless:/tmp/build
          docker exec dind-rootless sh -c 'export DOCKER_HOST=tcp://localhost:2376 DOCKER_TLS_VERIFY=1 DOCKER_CERT_PATH=/certs/client; docker build -t hello-dind /tmp/build'
          OUT=$(docker exec dind-rootless sh -c 'export DOCKER_HOST=tcp://localhost:2376 DOCKER_TLS_VERIFY=1 DOCKER_CERT_PATH=/certs/client; docker run --rm hello-dind')
          echo "Output: $OUT"
          echo "$OUT" | grep -q "inside Docker-in-Docker"
