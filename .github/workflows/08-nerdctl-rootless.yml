name: 08 Nerdctl Rootless

on:
  workflow_dispatch:

jobs:
  nerdctl-rootless:
    name: nerdctl + rootless containerd (無 root、無 daemon root)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安裝 rootless 相依套件
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq uidmap dbus-user-session >/dev/null
          newuidmap --version || true

      - name: 安裝 nerdctl full
        run: |
          VER="$(curl -fsSL https://api.github.com/repos/containerd/nerdctl/releases/latest | grep -oP '"tag_name":\s*"\K[^"]+')"
          curl -fsSL "https://github.com/containerd/nerdctl/releases/download/${VER}/nerdctl-full-${VER#v}-linux-amd64.tar.gz" -o /tmp/nerdctl.tgz
          sudo tar -xzf /tmp/nerdctl.tgz -C /usr/local
          nerdctl --version

      - name: 解除 AppArmor 對 unprivileged userns 的限制 (Ubuntu 24.04)
        run: |
          # runner 的 kernel.apparmor_restrict_unprivileged_userns=1 會擋 rootlesskit 與 buildkitd
          # 依官方提示為兩者寫 unconfined+userns profile
          for BIN in rootlesskit buildkitd; do
            cat <<EOT | sudo tee "/etc/apparmor.d/usr.local.bin.$BIN" >/dev/null
          abi <abi/4.0>,
          include <tunables/global>

          /usr/local/bin/$BIN flags=(unconfined) {
            userns,

            include if exists <local/usr.local.bin.$BIN>
          }
          EOT
          done
          sudo systemctl restart apparmor.service 2>/dev/null || sudo apparmor_parser -r -T /etc/apparmor.d || true
          echo "apparmor profiles 已套用"

      - name: 手動啟動 rootless containerd (背景程序,非 systemd user 單元)
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          mkdir -p "$XDG_RUNTIME_DIR" /tmp/rootless-logs
          nohup containerd-rootless.sh > /tmp/rootless-logs/containerd.log 2>&1 &
          for i in $(seq 1 20); do
            if nerdctl info >/dev/null 2>&1; then echo "rootless containerd 就緒"; break; fi
            sleep 2
          done
          nerdctl info | grep -E 'Server Version|Storage Driver' | head -3

      - name: 手動啟動 rootless buildkitd (供 nerdctl build)
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          nohup buildkitd \
            --root "$XDG_RUNTIME_DIR/buildkit" \
            --addr "unix://$XDG_RUNTIME_DIR/buildkit/buildkitd.sock" \
            --oci-worker-no-process-sandbox > /tmp/rootless-logs/buildkitd.log 2>&1 &
          for i in $(seq 1 20); do
            if buildctl --addr "unix://$XDG_RUNTIME_DIR/buildkit/buildkitd.sock" debug workers >/dev/null 2>&1; then
              echo "rootless buildkitd 就緒"; break
            fi
            sleep 2
          done
          if ! buildctl --addr "unix://$XDG_RUNTIME_DIR/buildkit/buildkitd.sock" debug workers >/dev/null 2>&1; then
            echo "buildkitd 未就緒,傾印日誌:"; cat /tmp/rootless-logs/buildkitd.log
            exit 1
          fi
          buildctl --addr "unix://$XDG_RUNTIME_DIR/buildkit/buildkitd.sock" debug workers | head -3

      - name: nerdctl run (rootless)
        run: |
          OUT="$(nerdctl run --rm alpine:3.20 echo 'nerdctl rootless 執行 OK')"
          echo "$OUT"

      - name: nerdctl build (rootless)
        run: |
          nerdctl build -t hello-rootless samples/hello
          OUT="$(nerdctl run --rm hello-rootless)"
          echo "輸出: $OUT"
          echo "$OUT" | grep -q "without Docker-in-Docker"

      - name: 確認 rootless 環境
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR"
          ls "$XDG_RUNTIME_DIR/containerd" 2>/dev/null | head -3
          echo "確認: containerd 以非 root 身分執行 (rootless)"
          ps -ef | grep '[c]ontainerd-rootless' | head -2
          nerdctl info | grep -i rootless || true
