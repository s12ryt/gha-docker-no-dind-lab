name: 05 Buildx Bake

on:
  workflow_dispatch:

jobs:
  buildx-bake:
    name: docker buildx + bake (進階建構)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 設定 Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: 準備 docker-bake.hcl
        run: |
          cat > docker-bake.hcl <<'EOF'
          group "default" {
            targets = ["hello", "hi"]
          }
          target "hello" {
            context = "./samples/hello"
            dockerfile = "Dockerfile"
            tags = ["hello-bake:local"]
          }
          target "hi" {
            context = "./samples/hello"
            dockerfile = "Dockerfile"
            tags = ["hi-bake:local"]
          }
          EOF

      - name: Buildx bake 多目標建構
        uses: docker/bake-action@v5
        with:
          files: docker-bake.hcl
          load: true
          set: |
            *.cache-from=type=gha,scope=buildx-bake
            *.cache-to=type=gha,scope=buildx-bake,mode=max

      - name: 驗證 bake 產物可執行
        run: |
          docker images --format '{{.Repository}}:{{.Tag}}' | grep -E 'hello-bake|hi-bake'
          OUT="$(docker run --rm hello-bake:local)"
          echo "輸出: $OUT"
          echo "$OUT" | grep -q "without Docker-in-Docker"

      - name: Buildx driver 資訊 (證明不是 DinD)
        run: |
          docker buildx ls
          docker buildx inspect | grep -E 'Driver|Status' | head -4
